services:
  web:
    build: .
    image: invest-system:latest
    container_name: invest-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      INVEST_DB: /data/invest.db
      SYMBOL: "600519"
    volumes:
      - ./data:/data
      - ./config:/app/config
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: .
    image: invest-system:latest
    container_name: invest-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      INVEST_DB: /data/invest.db
      CHAIN_YAML: config/chains/baijiu.yaml
      SYMBOL: "600519"
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    command: ["sh", "deploy/worker.sh"]
